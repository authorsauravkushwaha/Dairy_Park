  <!-- Analytics consent (only shown when analytics is configured in content.js) -->
  <section class="consent" id="consent" aria-labelledby="consent-title" hidden>
    <div class="consent__inner">
      <div class="consent__text">
        <h2 class="consent__title" id="consent-title" data-i18n="consent.title">Analytics choice</h2>
        <p data-i18n="consent.text">With your permission we use analytics to see which parts of this site help visitors. Nothing loads until you choose.</p>
      </div>
      <div class="consent__actions">
        <button type="button" class="btn btn--primary btn--sm" id="consentAccept" data-i18n="consent.accept">Allow analytics</button>
        <button type="button" class="btn btn--ghost btn--sm" id="consentDecline" data-i18n="consent.decline">No thanks</button>
        <a class="consent__link" href="{{base}}privacy.html" data-i18n="consent.privacy">Privacy note</a>
      </div>
    </div>
  </section>
